[package]
name = "shinkai-native"
version = "0.1.0"
edition = "2021"

[lib]
name = "shinkai"
crate-type = ["cdylib"]

[dependencies]
jni = "0.21"
ureq = { version = "2.9", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
md-5 = "0.10"

[profile.release]
lto = true
opt-level = "s"
strip = true
